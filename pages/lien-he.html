<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- INJECT_SEO_TAGS -->
  <link rel="stylesheet" href="/assets/css/globals.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body data-theme="blue">
  <!-- INJECT_COMPONENT: components/header.html -->
  <main id="main-content">
    <div style="background: linear-gradient(135deg, var(--color-secondary) 0%, var(--color-white) 100%); padding: 60px 0; border-bottom: 1px solid var(--color-border); text-align: center;">
      <div class="skmd-container">
        <h1 style="font-size: 2.5rem; color: var(--color-primary-dark); margin-bottom: 16px;">Liên Hệ</h1>
        <p style="color: var(--color-text-light); max-width: 600px; margin: 0 auto; font-size: 1.125rem;">Kết nối với Phòng khám chuyên khoa Cắt Trĩ Cần Thơ để được tư vấn và đặt lịch khám nhanh chóng.</p>
      </div>
    </div>
    <div class="skmd-container" style="padding: 40px 0 60px;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px;">
            <div style="background: var(--color-white); padding: 32px; border: 1px solid var(--color-border); border-radius: var(--radius-lg);">
                <h3 style="font-size: 1.5rem; color: var(--color-primary-dark); margin-bottom: 24px;">Thông Tin Liên Hệ</h3>
                <p style="margin-bottom: 12px;"><strong>Hotline:</strong> **** ****</p>
                <p style="margin-bottom: 12px;"><strong>Địa chỉ:</strong> Cần Thơ, Việt Nam</p>
                <p style="margin-bottom: 12px;"><strong>Giờ làm việc:</strong> 08:00 - 20:00 (Tất cả các ngày trong tuần)</p>
            </div>
            <div style="background: var(--color-white); padding: 32px; border: 1px solid var(--color-border); border-radius: var(--radius-lg);">
                <h3 style="font-size: 1.5rem; color: var(--color-primary-dark); margin-bottom: 24px;">Bản Đồ Chỉ Đường</h3>
                <div style="background: #f4f4f5; height: 200px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md);">
                    <p style="color: var(--color-text-light);">Google Maps Embed Here</p>
                </div>
            </div>
        </div>
    </div>
  </main>
  <!-- INJECT_COMPONENT: components/footer.html -->
  <script src="/assets/js/core.js" type="module" defer></script>
</body>
</html>
