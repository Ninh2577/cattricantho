<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- INJECT_SEO_TAGS -->
  <link rel="stylesheet" href="/assets/css/globals.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body data-theme="blue">
  <!-- INJECT_COMPONENT: components/header.html -->
  <main id="main-content">
    <div style="background: linear-gradient(135deg, var(--color-white) 0%, var(--color-bg-offset) 100%); padding: 120px 0; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; position: relative; overflow: hidden;">
      
      <!-- Background Decorative Elements -->
      <div style="position: absolute; top: -50px; left: -50px; opacity: 0.05; transform: rotate(-15deg);">
        <svg width="300" height="300" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L12 22M2 12L22 12" stroke="var(--color-primary)" stroke-width="4" stroke-linecap="round"/></svg>
      </div>
      <div style="position: absolute; bottom: -50px; right: -50px; opacity: 0.05; transform: rotate(15deg);">
        <svg width="300" height="300" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L12 22M2 12L22 12" stroke="var(--color-primary)" stroke-width="4" stroke-linecap="round"/></svg>
      </div>

      <div class="skmd-container" style="position: relative; z-index: 1;">
        <!-- Illustration -->
        <div style="margin-bottom: 32px; display: inline-flex; align-items: center; justify-content: center; width: 120px; height: 120px; background: white; border-radius: 50%; box-shadow: 0 10px 30px rgba(2, 132, 199, 0.15); position: relative; animation: float 3s ease-in-out infinite;">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <div style="position: absolute; top: 0; right: 0; background: #ef4444; color: white; font-weight: bold; font-size: 0.8rem; padding: 4px 8px; border-radius: 12px; transform: translate(30%, -20%); box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);">404</div>
        </div>
        
        <style>
          @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
          }
        </style>

        <h1 style="font-size: 2.5rem; color: var(--color-primary-dark); margin-bottom: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">Trang không tìm thấy</h1>
        <p style="color: var(--color-text-main); max-width: 500px; margin: 0 auto 32px; font-size: 1.125rem; line-height: 1.6;">Xin lỗi, nội dung bạn đang tìm kiếm có thể đã bị xóa, đổi tên, hoặc hiện đang được đội ngũ y bác sĩ của chúng tôi nâng cấp.</p>
        
        <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
          <a href="/" class="skmd-btn skmd-btn--primary skmd-btn--lg" style="display: inline-flex; align-items: center; gap: 8px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Quay Về Trang Chủ
          </a>
          <a href="/kien-thuc" class="skmd-btn skmd-btn--outline skmd-btn--lg" style="display: inline-flex; align-items: center; gap: 8px; background: white;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
            Đọc Kiến Thức Y Khoa
          </a>
        </div>

        <!-- Quick Links -->
        <div style="margin-top: 48px; border-top: 1px solid var(--color-border); padding-top: 32px;">
          <p style="color: var(--color-text-light); font-size: 0.95rem; margin-bottom: 16px;">Hoặc truy cập nhanh các chuyên mục:</p>
          <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <a href="/tri-noi" style="color: var(--color-primary); text-decoration: none; font-weight: 500; font-size: 0.95rem; padding: 8px 16px; background: white; border-radius: 50px; border: 1px solid var(--color-border); transition: all 0.2s;">Bệnh Trĩ Nội</a>
            <a href="/tri-ngoai" style="color: var(--color-primary); text-decoration: none; font-weight: 500; font-size: 0.95rem; padding: 8px 16px; background: white; border-radius: 50px; border: 1px solid var(--color-border); transition: all 0.2s;">Bệnh Trĩ Ngoại</a>
            <a href="/ro-hau-mon" style="color: var(--color-primary); text-decoration: none; font-weight: 500; font-size: 0.95rem; padding: 8px 16px; background: white; border-radius: 50px; border: 1px solid var(--color-border); transition: all 0.2s;">Rò Hậu Môn</a>
            <a href="/lien-he" style="color: var(--color-primary); text-decoration: none; font-weight: 500; font-size: 0.95rem; padding: 8px 16px; background: white; border-radius: 50px; border: 1px solid var(--color-border); transition: all 0.2s;">Liên Hệ</a>
          </div>
        </div>

      </div>
    </div>
  </main>
  <!-- INJECT_COMPONENT: components/footer.html -->
  <script src="/assets/js/core.js" type="module" defer></script>
</body>
</html>
