<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- INJECT_SEO_TAGS -->
  <link rel="stylesheet" href="/assets/css/globals.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <style>
    /* Article Specific CSS */
    .skmd-article-header {
      padding: 40px 0;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 40px;
    }
    .skmd-article-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
      color: var(--color-text-light);
      font-size: 0.95rem;
    }
    .skmd-article-author {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--color-primary-dark);
    }
    .skmd-article-author img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
    .skmd-article-body {
      font-size: 1.125rem;
      line-height: 1.8;
      color: var(--color-text-main);
    }
    .skmd-article-body h2 {
      margin-top: 40px;
      margin-bottom: 20px;
    }
    .skmd-article-body img {
      border-radius: var(--radius-md);
      margin: 32px 0;
    }
    /* Sidebar CSS */
    .skmd-sidebar-widget {
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 32px;
      position: sticky;
      top: 100px;
    }
    .skmd-sidebar-widget__title {
      font-size: 1.25rem;
      color: var(--color-primary-dark);
      margin-bottom: 16px;
      border-bottom: 2px solid var(--color-secondary);
      padding-bottom: 8px;
    }
    .skmd-toc {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .skmd-toc a {
      color: var(--color-text-light);
    }
    .skmd-toc a:hover {
      color: var(--color-primary);
    }
  </style>
</head>
<body data-theme="blue">
  <!-- INJECT_COMPONENT: components/header.html -->
  
  <main id="main-content">
    
    <div class="skmd-container">
      <!-- Breadcrumb -->
      <nav class="skmd-breadcrumb" style="padding: 20px 0;">
        <!-- INJECT_COMPONENT: components/breadcrumb.html -->
      </nav>

      <div class="skmd-layout-sidebar">
        <!-- MAIN ARTICLE -->
         <article class="skmd-article">
          <header class="skmd-article-header">
            <span class="skmd-badge skmd-badge--primary" style="margin-bottom:16px;"><!-- INJECT_ARTICLE_CATEGORY --></span>
            <h1 class="skmd-heading-1" style="font-size: 2.5rem; line-height: 1.3;"><!-- INJECT_ARTICLE_TITLE --></h1>
            
            <div class="skmd-article-meta">
              <div class="skmd-article-author">
                <img src="<!-- INJECT_AUTHOR_AVATAR -->" alt="<!-- INJECT_AUTHOR_NAME -->">
                <span><!-- INJECT_AUTHOR_NAME --></span>
              </div>
              <span>|</span>
              <span><i class="icon-calendar"></i> <!-- INJECT_ARTICLE_DATE --></span>
              <span>|</span>
              <span><i class="icon-clock"></i> <!-- INJECT_READING_TIME --> phút đọc</span>
              <span>|</span>
              <span style="color: var(--color-success);"><i class="icon-check"></i> Đã kiểm duyệt y khoa</span>
            </div>
          </header>

          <div class="skmd-article-body">
            <p class="skmd-text-lead"><!-- INJECT_ARTICLE_EXCERPT --></p>
            
            <!-- INJECT_ARTICLE_FEATURED_IMAGE -->

            <!-- INJECT_ARTICLE_CONTENT -->

          </div>
          
          <!-- Author Box -->
          <div style="background: var(--color-bg-offset); padding: 32px; border-radius: var(--radius-md); margin-top: 60px;">
            <div style="display: flex; gap: 24px; align-items: center;">
              <img src="<!-- INJECT_REVIEWER_AVATAR -->" alt="<!-- INJECT_REVIEWER_NAME -->" style="border-radius:50%; width:100px; height:100px; object-fit:cover;">
              <div>
                <h3 style="margin-bottom:8px;">Tham vấn y khoa: <!-- INJECT_REVIEWER_NAME --></h3>
                <p style="color: var(--color-text-light); margin-bottom:0;"><!-- INJECT_REVIEWER_ROLE --></p>
              </div>
            </div>
          </div>
        </article>

        <!-- SIDEBAR -->
        <aside class="skmd-sidebar">
          
          <!-- Table of Contents -->
          <div class="skmd-sidebar-widget">
            <h3 class="skmd-sidebar-widget__title">Mục Lục</h3>
            <ul class="skmd-toc">
              <li><a href="#">1. Nguyên nhân gây bệnh trĩ</a></li>
              <li><a href="#">2. Phương pháp điều trị</a></li>
              <li><a href="#">3. Lời khuyên từ bác sĩ</a></li>
            </ul>
          </div>

          <!-- CTA Widget -->
          <!-- INJECT_COMPONENT: components/cta.html -->

        </aside>
      </div>
    </div>
  </main>

  <!-- INJECT_COMPONENT: components/footer.html -->
  <script src="/assets/js/core.js" type="module" defer></script>
</body>
</html>
