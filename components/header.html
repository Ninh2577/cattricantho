<!-- Enterprise Header Component -->
<header class="skmd-header" id="platform-header">

  <!-- Main Navbar -->
  <div class="skmd-header__main">
    <div class="skmd-container skmd-header__main-inner">
      <!-- Logo -->
      <a href="/" class="skmd-logo" aria-label="Trang chủ">
        <!-- SVG Placeholder Logo for Medical (Blue Cross style) -->
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="skmd-logo__icon" aria-hidden="true">
          <path d="M12 2L12 22M2 12L22 12" stroke="var(--color-primary)" stroke-width="4" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="10" stroke="var(--color-primary-light)" stroke-width="2" opacity="0.3"/>
        </svg>
        <span class="skmd-logo__text"><!-- INJECT_BRAND --></span>
      </a>

      <!-- Desktop Menu -->
      <nav class="skmd-nav-desktop" aria-label="Menu chính">
        <ul class="skmd-menu">
          <li><a href="/" class="skmd-menu__link">Trang chủ</a></li>
          <li><a href="/tri" class="skmd-menu__link">Trĩ</a></li>
          <li><a href="/tri-noi" class="skmd-menu__link">Trĩ nội</a></li>
          <li><a href="/tri-ngoai" class="skmd-menu__link">Trĩ ngoại</a></li>
          <li><a href="/tri-hon-hop" class="skmd-menu__link">Trĩ hỗn hợp</a></li>
          <li><a href="/ro-hau-mon" class="skmd-menu__link">Rò hậu môn</a></li>
        </ul>
      </nav>

      <!-- CTA & Mobile Toggle -->
      <div class="skmd-header__actions">
        <a href="/kien-thuc" class="skmd-btn skmd-btn--primary skmd-header__cta">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px; vertical-align: middle;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          Khám phá kiến thức
        </a>
        <button class="skmd-menu-toggle" aria-label="Mở menu" aria-expanded="false" aria-controls="mobile-menu">
          <span class="skmd-menu-toggle__line"></span>
          <span class="skmd-menu-toggle__line"></span>
          <span class="skmd-menu-toggle__line"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Off-Canvas Menu -->
  <div class="skmd-offcanvas" id="mobile-menu" aria-hidden="true">
    <div class="skmd-offcanvas__backdrop" data-action="close-menu"></div>
    <div class="skmd-offcanvas__panel">
      <div class="skmd-offcanvas__header">
        <span class="skmd-logo__text"><!-- INJECT_BRAND --></span>
        <button class="skmd-offcanvas__close" aria-label="Đóng menu" data-action="close-menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <nav class="skmd-nav-mobile" aria-label="Menu di động">
        <ul class="skmd-mobile-menu">
          <li><a href="/" class="skmd-mobile-menu__link">Trang chủ</a></li>
          <li><a href="/tri" class="skmd-mobile-menu__link">Trĩ</a></li>
          <li><a href="/tri-noi" class="skmd-mobile-menu__link">Trĩ nội</a></li>
          <li><a href="/tri-ngoai" class="skmd-mobile-menu__link">Trĩ ngoại</a></li>
          <li><a href="/tri-hon-hop" class="skmd-mobile-menu__link">Trĩ hỗn hợp</a></li>
          <li><a href="/ro-hau-mon" class="skmd-mobile-menu__link">Rò hậu môn</a></li>
          <li><a href="/lien-he" class="skmd-mobile-menu__link">Liên hệ</a></li>
        </ul>
      </nav>
      <div class="skmd-offcanvas__footer">
        <a href="/kien-thuc" class="skmd-btn skmd-btn--outline skmd-btn--full">Khám phá kiến thức</a>
      </div>
    </div>
  </div>
</header>
